<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#ffdce5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    padding:15px;
}

.container{
    width:100%;
    max-width:500px;
    background:#fff0f4;
    padding:30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    position:relative;
}

#topImage, #acceptedImage, #thankImage{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:15px;
    margin-bottom:20px;
}

h1{
    color:#ff4f81;
    margin-bottom:15px;
}

p{
    color:#555;
    margin-bottom:20px;
}

.buttons{
    position:relative;
    width:100%;
    height:120px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    transition:0.2s;
}

#yesBtn{
    background:#ff6f91;
    color:white;
    position:absolute;
    left:30%;
    top:50%;
    transform:translate(-50%, -50%);
}

#noBtn{
    background:#ffc2d1;
    color:#333;
    position:absolute;
    left:70%;
    top:50%;
    transform:translate(-50%, -50%);
}

.hidden{ display:none; }

select, input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ffb3c6;
    outline:none;
    font-size:16px;
}

#saveBtn{
    background:#ff6f91;
    color:white;
    width:100%;
    margin-top:20px;
}

.thankyou{
    color:#ff4f81;
    font-size:24px;
    margin-top:20px;
}

#continueBtn{
    background:#ff6f91;
    color:white;
}

@media screen and (max-width:600px){
    .container{ padding:20px; }
    h1{ font-size:24px; }
    p{ font-size:14px; }
    button{ font-size:14px; padding:10px 18px; }
}
</style>
</head>

<body>

<div class="container">

    <div id="firstPage">
        <img id="topImage" src="please.jpeg">
        <h1>Pyangggg</h1>
        <p>can we play a game pag free ka?</p>

        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>

        <p><b>you can't say no to this 😭</b></p>
    </div>

    <div id="acceptedPage" class="hidden">
        <img id="acceptedImage" src="happy.jpeg">
        <h1>You Accepted!</h1>
        <p>YAYYYY!!</p>
        <button id="continueBtn">Continue</button>
    </div>

    <div id="genrePage" class="hidden">
        <h1>Game Details</h1>

        <p>Genre:</p>
        <select id="genre">
            <option value="">-- Select Genre --</option>
            <option>Horror</option>
            <option>Adventure</option>
            <option>Mini Games</option>
            <option>Tycoon</option>
            <option>Simulator</option>
            <option>Obby</option>
            <option>Roleplay</option>
        </select>

        <p>Anong Araw?</p>
        <input type="date" id="date">

        <p>Anong Oras?</p>
        <input type="time" id="time">

        <button id="saveBtn">Save Invitation</button>
    </div>

    <div id="thankPage" class="hidden">
        <img id="thankImage" src="success.jpeg">
        <h1 class="thankyou">Thank You</h1>
        <p>Your invitation has been saved.</p>
    </div>

</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const continueBtn = document.getElementById("continueBtn");
const buttons = document.querySelector(".buttons");

const WEBHOOK_URL = "https://discord.com/api/webhooks/1509072027430948924/qDbYZaDJEVdnfII7QGHIKgisKoK3luS4JZ12Z77EKYsJDpJrgNmUXtzQUIcHNPdTkbEh";

function moveNoButton() {
    const areaWidth = buttons.clientWidth - noBtn.offsetWidth;
    const areaHeight = buttons.clientHeight - noBtn.offsetHeight;

    const x = Math.random() * areaWidth;
    const y = Math.random() * areaHeight;

    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
    noBtn.style.transform = "none";
}

noBtn.addEventListener("mouseenter", moveNoButton);
noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    moveNoButton();
});
noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    moveNoButton();
});

yesBtn.addEventListener("click", () => {
    document.getElementById("firstPage").classList.add("hidden");
    document.getElementById("acceptedPage").classList.remove("hidden");
});

continueBtn.addEventListener("click", () => {
    document.getElementById("acceptedPage").classList.add("hidden");
    document.getElementById("genrePage").classList.remove("hidden");
});

document.getElementById("saveBtn").addEventListener("click", async () => {

    const genre = document.getElementById("genre").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    if(!genre || !date || !time){
        alert("Kumpletuhin mo 😭");
        return;
    }

    const data = {
        content: `🎮 New Invitation:\nGenre: ${genre}\nDate: ${date}\nTime: ${time}`
    };

    try {
        await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
    } catch (err) {
        console.log("Webhook failed:", err);
    }

    localStorage.setItem("invitationData", JSON.stringify({ genre, date, time }));

    document.getElementById("genrePage").classList.add("hidden");
    document.getElementById("thankPage").classList.remove("hidden");
});
</script>

</body>
</html>
